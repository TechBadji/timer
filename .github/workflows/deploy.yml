# Déploiement automatisé — inactif pour l'instant.
#
# GitHub Actions est bloqué sur ce compte (« account is locked due to a billing
# issue »). Le site est donc publié depuis la branche gh-pages, construite en
# local par `npm run deploy`.
#
# Pour repasser à l'automatique une fois la facturation régularisée :
#   1. régler le problème sur https://github.com/settings/billing
#   2. Settings → Pages → Source : « GitHub Actions »
#   3. rétablir le déclencheur `push` ci-dessous
name: Déploiement GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les poussées suivantes annulent la précédente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests (logique métier et persistance)
        run: npm test

      - name: Construire l'application
        run: npm run build

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déployer
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
